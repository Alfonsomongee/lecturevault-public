name: CI

# Everything that must stay green before a change goes into main:
#   typecheck + unit tests (Node 20 and 22), the browser tests of the dashboard, and the Python side.
# No secrets are needed: Gemini and the campus are always mocked or simulated in the tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit tests with coverage
        if: matrix.node == 20
        run: npm run test:coverage
      - name: Unit tests
        if: matrix.node != 20
        run: npm test
      - name: Upload coverage
        if: matrix.node == 20 && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Dashboard in a browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install ffmpeg (the audio capture test converts with it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scripts compile
        run: python -m py_compile scripts/transcribe.py scripts/generate_synthetic_fixture.py
      - name: Pinned requirements resolve together
        run: python -m pip install --dry-run -r requirements.txt
